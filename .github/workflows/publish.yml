# Publish @takazudo/zudo-design-token-lint to npm with OIDC trusted publishing.
#
# Procedure: RELEASING.md. Policy logic + tests: scripts/release/.
#
# No npm token is used anywhere. npm authenticates by exchanging this job's
# GitHub OIDC token, which only works once npm's trusted-publisher entry for the
# package names: owner Takazudo, repo zudo-design-token-lint, workflow
# publish.yml, NO environment, with direct publishing and dist-tag management
# allowed. If that entry is missing, publishing fails loudly. Nothing falls back
# to a stored credential.
#
# Triggers:
#   - push of an exact release tag (v1.2.3 / v1.2.3-next.4 / -beta.N / -rc.N)
#   - workflow_dispatch ON A TAG REF: exact-source recovery and finalization
#     resume, e.g. `gh workflow run publish.yml --ref v1.2.3`. release.yml uses
#     this path too, because a tag it creates with GITHUB_TOKEN does not fire
#     the push trigger.
#
# Jobs:
#   admit    → enforces tag / version / source / CI admission and reads the
#              exact registry state (absent | published | unknown)
#   build    → install, test, pack check and tarball. No id-token.
#   publish  → id-token only. No dependency install. Pinned npm publishes the
#              tarball. Runs only when the version is absent.
#   cleanup  → id-token only. Removes `next` if, and only if, it is strictly
#              older than the stable release. Always reports an outcome and
#              never fails the run.
#   finalize → contents:write only. Idempotent GitHub Release.
#   report   → partial-success summary.
#
# The shared group is non-cancelling because cleanup does a read-recheck-delete
# against the registry. A concurrent prerelease publish must not move `next`
# between the recheck and the rm.

name: Publish to npm
run-name: Publish ${{ github.ref_name }}${{ inputs.request_id && format(' [{0}]', inputs.request_id) || '' }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation id set by release.yml (leave empty for manual runs)
        required: false
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: '22'

jobs:
  admit:
    name: Admit release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.ci.outputs.ci_run_attempt }}
      registry_state: ${{ steps.registry.outputs.registry_state }}
      publish_tag: ${{ steps.dist.outputs.publish_tag }}
    steps:
      - name: Refuse non-tag refs
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::publish.yml only runs on a release tag ref, not '$REF'"; exit 1 ;;
          esac

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Admit tag (exact grammar, name, version)
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release/cli.mjs admit-tag --tag "$TAG"

      - name: Admit source (tag commit on origin/main)
        id: source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/release/cli.mjs admit-source --sha "$(git rev-parse HEAD)" --tag "$TAG"

      - name: Admit CI (successful CI push run for this exact commit)
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/release/cli.mjs admit-ci --sha "$SHA" --repo "$REPO"

      - name: Read exact registry state
        id: registry
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: node scripts/release/cli.mjs registry-state --version "$VERSION"

      - name: Existing publication must come from this commit
        if: steps.registry.outputs.registry_state == 'published'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/release/cli.mjs verify-published --version "$VERSION" --sha "$SHA"

      - name: Dist-tag regression guard
        id: dist
        if: steps.registry.outputs.registry_state == 'absent'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: node scripts/release/cli.mjs plan-publish-tag --version "$VERSION"

  build:
    name: Build and verify artifact
    needs: admit
    if: needs.admit.outputs.registry_state == 'absent'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha512: ${{ steps.pack.outputs.sha512 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.admit.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      # No dependency cache in the release path: avoids restoring a store that
      # another ref could have written.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package tests (pretest builds dist/)
        run: pnpm -w run test

      - name: Check pack (installed CLI + exports)
        run: bash scripts/check-pack.sh

      - name: Pack release tarball
        id: pack
        env:
          VERSION: ${{ needs.admit.outputs.version }}
        run: |
          pnpm run build
          mkdir -p release-artifact
          FILE=$(pnpm pack --pack-destination release-artifact --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(require("path").basename(JSON.parse(d).filename)))')
          INNER=$(tar -xOzf "release-artifact/$FILE" package/package.json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const p=JSON.parse(d);console.log(p.name+"@"+p.version)})')
          if [ "$INNER" != "@takazudo/zudo-design-token-lint@$VERSION" ]; then
            echo "::error::tarball contains $INNER, expected @takazudo/zudo-design-token-lint@$VERSION"
            exit 1
          fi
          echo "tarball=$FILE" >> "$GITHUB_OUTPUT"
          echo "sha512=$(sha512sum "release-artifact/$FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: release-artifact/${{ steps.pack.outputs.tarball }}
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish (OIDC)
    needs: [admit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      outcome: ${{ steps.publish.outputs.publish_outcome }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.admit.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/release

      # No registry-url: setup-node then writes no _authToken line and no
      # NODE_AUTH_TOKEN placeholder, so OIDC is the only credential path.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned npm (OIDC publish + dist-tag support)
        run: |
          NPM_PIN=$(node scripts/release/cli.mjs npm-version)
          npm install -g "npm@$NPM_PIN"
          node scripts/release/cli.mjs assert-runtime

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: release-artifact

      - name: Verify tarball digest
        env:
          FILE: ${{ needs.build.outputs.tarball }}
          EXPECTED: ${{ needs.build.outputs.sha512 }}
        run: |
          ACTUAL=$(sha512sum "release-artifact/$FILE" | cut -d' ' -f1)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::tarball digest mismatch"; exit 1; }

      # Re-read immediately before publishing: another run may have published
      # or moved the channel since admission.
      - name: Recheck registry state and dist-tag guard
        env:
          VERSION: ${{ needs.admit.outputs.version }}
        run: |
          node scripts/release/cli.mjs registry-state --version "$VERSION" | tee state.txt
          grep -qx 'registry_state=absent' state.txt || { echo "::error::$VERSION is no longer absent; re-dispatch publish.yml on the tag to resume"; exit 1; }
          node scripts/release/cli.mjs plan-publish-tag --version "$VERSION"

      - name: Publish package
        id: publish
        env:
          VERSION: ${{ needs.admit.outputs.version }}
          DIST_TAG: ${{ needs.admit.outputs.publish_tag }}
          FILE: ${{ needs.build.outputs.tarball }}
        run: node scripts/release/cli.mjs publish --version "$VERSION" --tag "$DIST_TAG" --tarball "release-artifact/$FILE"

      - name: Confirm visible on the registry
        env:
          VERSION: ${{ needs.admit.outputs.version }}
        run: node scripts/release/cli.mjs await-published --version "$VERSION"

  cleanup:
    name: Clean up stale next dist-tag
    needs: [admit, publish]
    if: >-
      always() && needs.admit.result == 'success' &&
      needs.admit.outputs.prerelease == 'false' &&
      (needs.publish.result == 'success' || needs.admit.outputs.registry_state == 'published')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      outcome: ${{ steps.cleanup.outputs.cleanup_outcome }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.admit.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/release

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned npm
        run: |
          npm install -g "npm@$(node scripts/release/cli.mjs npm-version)"
          node scripts/release/cli.mjs assert-runtime

      # Always exits 0 with an explicit outcome:
      # removed | noop-absent | noop-not-stale | noop-unparseable |
      # skipped-changed | error-query | error-remove | error-unconfirmed.
      - name: Remove next only if strictly older (recheck before delete)
        id: cleanup
        env:
          VERSION: ${{ needs.admit.outputs.version }}
        run: node scripts/release/cli.mjs cleanup-next --stable "$VERSION"

  finalize:
    name: Finalize GitHub Release
    needs: [admit, publish]
    if: >-
      always() && needs.admit.result == 'success' &&
      (needs.publish.result == 'success' || needs.admit.outputs.registry_state == 'published')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      outcome: ${{ steps.finalize.outputs.finalize_outcome }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.admit.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create or confirm the GitHub Release
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.admit.outputs.tag }}
          VERSION: ${{ needs.admit.outputs.version }}
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          node scripts/release/cli.mjs release-notes --version "$VERSION" --out "$NOTES"
          node scripts/release/cli.mjs finalize --tag "$TAG" --version "$VERSION" --notes-file "$NOTES" --repo "$REPO"

  report:
    name: Release report
    needs: [admit, build, publish, cleanup, finalize]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarize partial or full success
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          SHA: ${{ needs.admit.outputs.sha }}
          ADMIT: ${{ needs.admit.result }}
          CI_RUN: ${{ needs.admit.outputs.ci_run_id }}
          CI_ATTEMPT: ${{ needs.admit.outputs.ci_run_attempt }}
          STATE: ${{ needs.admit.outputs.registry_state }}
          BUILD: ${{ needs.build.result }}
          PUBLISH: ${{ needs.publish.result }}
          PUBLISH_OUTCOME: ${{ needs.publish.outputs.outcome }}
          CLEANUP: ${{ needs.cleanup.result }}
          CLEANUP_OUTCOME: ${{ needs.cleanup.outputs.outcome }}
          FINALIZE: ${{ needs.finalize.result }}
          FINALIZE_OUTCOME: ${{ needs.finalize.outputs.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$PUBLISH" = success ]; then
            PUB="published now via OIDC (fresh trusted-publishing evidence)"
          elif [ "$STATE" = published ]; then
            PUB="skipped: already on npm from this commit (NOT fresh OIDC evidence)"
          else
            PUB="$PUBLISH ${PUBLISH_OUTCOME:+($PUBLISH_OUTCOME)}"
          fi
          {
            echo "## Release ${TAG:-(not admitted)}"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Run | $RUN_ID attempt $RUN_ATTEMPT |"
            echo "| Admission | $ADMIT (commit \`${SHA:-?}\`, CI run ${CI_RUN:-?} attempt ${CI_ATTEMPT:-?}) |"
            echo "| Registry before | ${STATE:-unknown} |"
            echo "| Build | $BUILD |"
            echo "| npm publish | $PUB |"
            echo "| Stale next cleanup | $CLEANUP ${CLEANUP_OUTCOME:+($CLEANUP_OUTCOME)} |"
            echo "| GitHub Release | $FINALIZE ${FINALIZE_OUTCOME:+($FINALIZE_OUTCOME)} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FINALIZE" != success ] && { [ "$PUBLISH" = success ] || [ "$STATE" = published ]; }; then
            echo "::warning::npm has $TAG but the GitHub Release is not finalized. Resume with: gh workflow run publish.yml --ref $TAG (no republish, no retag)."
          fi
          case "$CLEANUP_OUTCOME" in error-*) echo "::warning::stale next cleanup reported $CLEANUP_OUTCOME — see RELEASING.md 'Stale next'";; esac
