# Hosted release initiation: the default path for agent and Cloud sessions,
# which dispatch this workflow (gh, GitHub MCP, or the Actions UI) instead of
# pushing a tag. Procedure: RELEASING.md.
#
# Inputs name the exact version and the FIXED candidate commit to release
# (`node scripts/release/cli.mjs candidate` selects the CI-green main head).
# The commit must already carry the version bump and changelog. Every admission
# rule from publish.yml runs here first:
#   - dispatched from main
#   - exact tag grammar, and package.json at that commit equals the version
#   - the commit is on origin/main
#   - a successful CI push run exists for that commit (run id and attempt recorded)
#   - the registry state is read exactly (absent | published | unknown → refuse)
#   - no dist-tag would regress
#
# Mode is decided by the remote tag, and the SHA is never replaced:
#   new    tag absent        → tag the candidate, dispatch publish.yml. If main
#                              moved on since selection, a warning names both
#                              SHAs; the candidate is still the one released.
#   resume tag at same SHA   → no new tag; dispatch publish.yml (an existing npm
#                              publication must match by provenance)
#   refuse tag at other SHA  → a release tag is never moved
#
# dry_run (the default) stops after admission: nothing is tagged, published or
# released. A GITHUB_TOKEN-created tag does not trigger workflows, so the start
# job dispatches publish.yml explicitly and records its exact run id.
# On a refused tag creation or dispatch, the job summary lists the HTTP status,
# message, request id, accepted permissions, candidate SHA, control (workflow)
# SHA and the .github/workflows files that differ between them. Those are
# observations for diagnosis, not a stated cause.

name: Start release
run-name: Start release v${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}${{ inputs.request_id && format(' [{0}]', inputs.request_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already in package.json at `sha` (e.g. 2.2.0 or 2.2.0-next.1)
        required: true
        type: string
      sha:
        description: Full 40-char fixed candidate commit on main that carries the bump + changelog
        required: true
        type: string
      dry_run:
        description: Only run admission (no tag, publish, dist-tag or Release changes)
        required: true
        type: boolean
        default: true
      request_id:
        description: Correlation id shown in the run title so the dispatcher can find this exact run
        required: false
        type: string

concurrency:
  group: release-start
  cancel-in-progress: false

permissions: {}

jobs:
  admit:
    name: Admit (non-mutating)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          # setup-node v5 auto-caches the packageManager (pnpm) by default; off in the release path.
          package-manager-cache: false

      - name: Admission (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/release/cli.mjs start --dry-run --sha "$SHA" --version "$VERSION" --repo "$REPO" --ref "$REF" --control-sha "$CONTROL_SHA"

  start:
    name: Tag and dispatch publish
    needs: admit
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          # setup-node v5 auto-caches the packageManager (pnpm) by default; off in the release path.
          package-manager-cache: false

      # Re-runs the full admission (state may have changed since the admit job),
      # then tags (new) or keeps the tag (resume) and dispatches publish.yml,
      # recording the exact run id.
      - name: Tag admitted commit and dispatch publish.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
          CONTROL_SHA: ${{ github.workflow_sha }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/release/cli.mjs start --sha "$SHA" --version "$VERSION" --repo "$REPO" --ref "$REF" --control-sha "$CONTROL_SHA" --request-id "$REQUEST_ID" --tries 2 --interval-sec 5
