packages:
  - 'doc'

# ── zfb doc-app install policy (read only from the workspace ROOT by pnpm) ──
# The doc site at doc/ is a zfb host-app. zfb + its platform binary, sharp, and
# workerd need their build scripts to run; minimumReleaseAgeExclude preserves
# the documented toolchain exceptions despite a global minimum release-age
# policy. Copied from the reference repo's pnpm-workspace.yaml.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@takazudo/zfb@6.0.1'
  - '@takazudo/zfb-runtime@6.0.1'
  - '@takazudo/zfb-md-wasm@6.0.1'
  - '@takazudo/zfb-adapter-cloudflare@6.0.1'
  - '@takazudo/zfb-slugify@6.0.1'
  - '@takazudo/zfb-darwin-arm64@6.0.1'
  - '@takazudo/zfb-darwin-x64@6.0.1'
  - '@takazudo/zfb-linux-arm64-gnu@6.0.1'
  - '@takazudo/zfb-linux-x64-gnu@6.0.1'
  - '@takazudo/zfb-win32-x64-msvc@6.0.1'
  - '@takazudo/zdtp@0.9.5'
